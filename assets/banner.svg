<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".6"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".2"/></linearGradient><style>@keyframes pulseGrid{0%{opacity:.15;transform:scale(.98)}50%{opacity:.35;transform:scale(1.01)}}@keyframes moveFlow{0%{stroke-dashoffset:400}}@keyframes floatGear{0%{transform:rotate(0deg)}}.bg-grid{animation:pulseGrid 6s ease-in-out infinite;transform-origin:center}.flow-line{stroke-dasharray:20,10;animation:moveFlow 12s linear infinite}.spinning-gear{animation:floatGear 25s linear infinite;transform-origin:1050px 150px}.text-subtitle,.text-title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Oxygen,Ubuntu,Cantarell,&apos;Open Sans&apos;,&apos;Helvetica Neue&apos;,sans-serif}.text-title{font-weight:800;fill:url(#textGrad)}.text-subtitle{font-weight:500;fill:#94a3b8}.badge-pill{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-weight:600;font-size:13px;fill:#38bdf8}</style></defs><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><g stroke="#334155" stroke-width="1" class="bg-grid"><path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200"/><path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300"/></g><path fill="none" stroke="#818cf8" stroke-width="2" d="M -50 220 Q 300 280 600 210 T 1250 180" class="flow-line" opacity=".4"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M -50 80 Q 400 20 800 90 T 1250 50" class="flow-line" opacity=".3"/><g fill="none" stroke="#c084fc" stroke-width="4" class="spinning-gear" opacity=".15"><circle cx="1050" cy="150" r="90"/><circle cx="1050" cy="150" r="50"/><path stroke-linecap="round" stroke-width="12" d="M1050 40 V60 M1050 240 V260 M940 150 H960 M1140 150 H1160 M972 72 L986 86 M1114 214 L1128 228 M972 228 L986 214 M1114 86 L1128 72"/></g><rect width="230" height="28" x="80" y="45" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity=".9" rx="14"/><text x="195" y="63" class="badge-pill" text-anchor="middle">⚙️ ISO 9001 &amp; FDA COMPLIANCE</text><text x="80" y="130" class="text-title" font-size="44" letter-spacing="-.5">Awesome Manufacturing QMS</text><text x="80" y="175" class="text-subtitle" font-size="20">A Curated Ecosystem of SaaS Platforms &amp; Open-Source Solutions</text><g transform="translate(80, 210)"><rect width="160" height="34" x="0" y="0" fill="url(#accentGrad)" stroke="#6366f1" stroke-width="1" rx="8"/><text x="80" y="22" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">📄 Document Control</text><rect width="140" height="34" x="175" y="0" fill="url(#accentGrad)" stroke="#6366f1" stroke-width="1" rx="8"/><text x="245" y="22" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔍 CAPA &amp; Audits</text><rect width="170" height="34" x="330" y="0" fill="url(#accentGrad)" stroke="#6366f1" stroke-width="1" rx="8"/><text x="415" y="22" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 Open-Source eQMS</text></g></svg>